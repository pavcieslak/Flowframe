<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3366"/>
      <stop offset="1" stop-color="#7B4DFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="22" fill="url(#bg)"/>
  <rect x="2" y="2" width="92" height="92" rx="22" fill="url(#shine)"/>
  <!-- frame -->
  <rect x="20" y="17" width="56" height="62" rx="9" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-dasharray="7 5"/>
  <!-- stacked items -->
  <rect x="28" y="25" width="40" height="11" rx="3.5" fill="#fff"/>
  <rect x="28" y="42.5" width="30" height="11" rx="3.5" fill="#fff" fill-opacity=".92"/>
  <rect x="28" y="60" width="35" height="11" rx="3.5" fill="#fff" fill-opacity=".85"/>
  <!-- gap markers -->
  <rect x="64" y="37.2" width="9" height="4.2" rx="1" fill="#FFD84D"/>
  <rect x="64" y="54.7" width="9" height="4.2" rx="1" fill="#FFD84D"/>
</svg>
