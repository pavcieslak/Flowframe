<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { color: #d6d6d6; font-size: 12px; padding: 10px; margin: 0; background: transparent; }
  h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: #9a9a9a; margin: 14px 0 6px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .row label { width: 62px; color: #b5b5b5; }
  .grid4 { display: flex; gap: 4px; }
  .grid4 div { display: flex; flex-direction: column; align-items: center; flex: 1; }
  .grid4 span { font-size: 10px; color: #8a8a8a; }
  input[type=text] { width: 100%; box-sizing: border-box; }
  select { flex: 1; }
  button { margin: 0 4px 4px 0; }
  .seg { display: flex; gap: 2px; flex: 1; }
  .seg button { flex: 1; margin: 0; padding: 2px 0; }
  .seg.icons { flex: 0 0 auto; }
  .seg.icons button { flex: 0 0 auto; width: 32px; height: 26px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
  .seg.icons button svg { display: block; }
  #segAlign.dirV .ih, #segAlign.dirH .iv { display: none; }
  .seg button.on { background: #2680eb; color: #fff; border-color: #2680eb; }
  #status { color: #9a9a9a; margin: 4px 0 8px; min-height: 16px; }
  #status.al { color: #6fb5ff; }
  #msg { color: #e8a33d; min-height: 14px; margin-top: 8px; font-size: 11px; }
  .hidden { display: none; }
  .check { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  hr { border: 0; border-top: 1px solid #444; margin: 12px 0; }
</style>
</head>
<body>
  <div id="status">Select a group or several objects.</div>

  <div id="createBox">
    <button id="btnCreate">Add auto layout</button>
  </div>

  <div id="settingsBox" class="hidden">
    <h3>Layout</h3>
    <div class="row"><label>Direction</label>
      <div class="seg icons" id="segDir"><button data-v="V" title="Vertical layout"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="7.25" y="2" width="1.5" height="9" fill="#d0d0d0"/><path d="M4 9 L8 13.5 L12 9 Z" fill="#d0d0d0"/></svg></button><button data-v="H" title="Horizontal layout"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="7.25" width="9" height="1.5" fill="#d0d0d0"/><path d="M9 4 L13.5 8 L9 12 Z" fill="#d0d0d0"/></svg></button></div>
    </div>
    <div class="row"><label>Gap (pt)</label><input type="text" inputmode="decimal" id="gap" step="1"></div>
    <div class="row"><label>Spacing</label>
      <select id="justify">
        <option value="start">Packed – start</option>
        <option value="center">Packed – centre</option>
        <option value="end">Packed – end</option>
        <option value="between">Space between</option>
      </select>
    </div>
    <div class="row"><label>Align</label>
      <div class="seg icons" id="segAlign"><button data-v="start" title="Align start (left / top)"><span class="iv"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="1.5" height="13" fill="#d0d0d0"/><rect x="4" y="3.5" width="10.5" height="3.5" rx="0.8" fill="#d0d0d0"/><rect x="4" y="9" width="6.5" height="3.5" rx="0.8" fill="#d0d0d0"/></svg></span><span class="ih"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="1.5" fill="#d0d0d0"/><rect x="3.5" y="4" width="3.5" height="10.5" rx="0.8" fill="#d0d0d0"/><rect x="9" y="4" width="3.5" height="6.5" rx="0.8" fill="#d0d0d0"/></svg></span></button><button data-v="center" title="Align centre"><span class="iv"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="7.25" y="1.5" width="1.5" height="13" fill="#d0d0d0"/><rect x="2.5" y="3.5" width="11" height="3.5" rx="0.8" fill="#d0d0d0"/><rect x="4.5" y="9" width="7" height="3.5" rx="0.8" fill="#d0d0d0"/></svg></span><span class="ih"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="7.25" width="13" height="1.5" fill="#d0d0d0"/><rect x="3.5" y="2.5" width="3.5" height="11" rx="0.8" fill="#d0d0d0"/><rect x="9" y="4.5" width="3.5" height="7" rx="0.8" fill="#d0d0d0"/></svg></span></button><button data-v="end" title="Align end (right / bottom)"><span class="iv"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="13" y="1.5" width="1.5" height="13" fill="#d0d0d0"/><rect x="1.5" y="3.5" width="10.5" height="3.5" rx="0.8" fill="#d0d0d0"/><rect x="5.5" y="9" width="6.5" height="3.5" rx="0.8" fill="#d0d0d0"/></svg></span><span class="ih"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="13" width="13" height="1.5" fill="#d0d0d0"/><rect x="3.5" y="1.5" width="3.5" height="10.5" rx="0.8" fill="#d0d0d0"/><rect x="9" y="5.5" width="3.5" height="6.5" rx="0.8" fill="#d0d0d0"/></svg></span></button></div>
    </div>

    <h3>Padding (pt)</h3>
    <div class="grid4">
      <div><input type="text" inputmode="decimal" id="pt"><span>Top</span></div>
      <div><input type="text" inputmode="decimal" id="pr"><span>Right</span></div>
      <div><input type="text" inputmode="decimal" id="pb"><span>Bottom</span></div>
      <div><input type="text" inputmode="decimal" id="pl"><span>Left</span></div>
    </div>

    <h3>Size</h3>
    <div class="row"><label>Width</label>
      <select id="wMode"><option value="hug">Hug contents</option><option value="fixed">Fixed</option></select>
      <input type="text" inputmode="decimal" id="w" style="width:64px">
    </div>
    <div class="row"><label>Height</label>
      <select id="hMode"><option value="hug">Hug contents</option><option value="fixed">Fixed</option></select>
      <input type="text" inputmode="decimal" id="h" style="width:64px">
    </div>

    <h3>Background</h3>
    <div id="bgInfo" style="margin-bottom:6px;color:#9a9a9a"></div>
    <button id="btnBg">Add background frame</button>

    <hr>
    <button id="btnReflow">Reflow</button>
    <button id="btnRemove">Remove auto layout</button>
  </div>

  <div id="childBox" class="hidden">
    <h3>Selected child</h3>
    <div class="check"><input type="checkbox" id="fill"><span>Fill container (cross axis)</span></div>
    <div class="check"><input type="checkbox" id="absolute"><span>Ignore auto layout (absolute)</span></div>
    <div class="check"><input type="checkbox" id="asBg"><span>Use as background frame</span></div>
    <button id="btnHug" class="hidden">Make text frame hug its text</button>
  </div>

  <hr>
  <div class="check"><input type="checkbox" id="auto"><span>Auto-reflow when contents change</span></div>
  <button id="btnReflowAll">Reflow all on this spread</button>
  <div id="msg"></div>

  <script src="index.js"></script>
</body>
</html>
